# Claude Code — project skills per the Agent Skills spec (agentskills.io).
# Claude Code loads .claude/skills/<name>/SKILL.md and exposes each as /<name>.
agent: claude
description: Claude Code project skills
output_directory: .claude/skills
# Claude Code extends the spec with argument-hint frontmatter (autocomplete hint).
argument_hint: true
# Where the committed permission allowlist is written (relative to the project
# root). Claude Code reads permissions from .claude/settings.json.
permissions_file: .claude/settings.json
