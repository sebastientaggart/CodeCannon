# Shared cross-tool skills directory per the Agent Skills spec (agentskills.io).
# Codex CLI, Cursor, and Gemini CLI all read .agents/skills/<name>/SKILL.md
# natively (for Gemini it even takes precedence over .gemini/skills/), so one
# rendered output serves all three. The legacy codex/cursor/gemini adapter
# names alias to this adapter.
agent: agents
description: Shared Agent Skills output (Codex CLI, Cursor, Gemini CLI)
output_directory: .agents/skills
argument_hint: false
# notes: invocation mechanics only (how skills are triggered, where files
# land). Never record what a tool can or cannot do — see "Backend capability
# claims" in AGENTS.md.
notes: |
  Skills are triggered by description matching, or by name where the tool
  supports it.
