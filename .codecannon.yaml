# .codecannon.yaml — project configuration for Code Cannon skill sync
#
# This is Code Cannon's own config. Unlike consumer projects (which run CodeCannon/sync.py),
# this repo runs sync as ./sync.py — Code Cannon is not a submodule of itself.
#
# See config.schema.yaml for documentation on each placeholder.

# Which skill group to enable. Exactly one per project.
# Available groups are sibling directories under CodeCannon/skills/.
# Today's options: github-agile
skill_group: github-agile

# Which agent adapters to generate skills for.
# Available: claude (.claude/skills/), agents (.agents/skills/ — read natively
# by Codex CLI, Cursor, and Gemini CLI). The legacy names cursor/codex/gemini
# still work as aliases for agents.
adapters:
  - claude
  - agents

# Placeholder values substituted into skill files during sync.
# Remove any you don't need; sync.py will warn about unresolved placeholders.
config:
  BRANCH_PROD: main
  BRANCH_DEV: dev
  BRANCH_TEST: ""
  REVIEW_GATE: "ai"
  REVIEW_EFFORT: "medium"
  START_APPROVAL_GATE: "true"
  ISSUE_FULL_STRUCTURE: "true"
  DEV_CMD: make dev
  ABANDON_CMD: make abandon
  CHECK_CMD: make check
  TEST_CMD: make test
  MERGE_CMD: make merge
  DEPLOY_PREVIEW_CMD: make deploy-preview
  DEPLOY_PROD_CMD: make deploy-prod
  VERSION_READ_CMD: "cat VERSION"
  BUMP_PATCH_CMD: make bump-patch
  BUMP_MINOR_CMD: make bump-minor
  BUMP_MAJOR_CMD: make bump-major
  # SET_VERSION_CMD is concatenated with the version (no implicit separator),
  # so include the trailing separator your command needs: `=` for kwarg-style
  # (e.g. "make set-version V="), trailing space for positional (e.g. "npm version ").
  SET_VERSION_CMD: "make set-version V="
  REVIEW_AGENT_PROMPT: .claude/review-agent-prompt.md
  DEFAULT_REVIEWERS: "@sebastientaggart"
  TICKET_LABELS: "bug, documentation, enhancement, chore"
  TICKET_LABEL_CREATION_ALLOWED: "false"
  DEFAULT_MILESTONE: ""
  QA_READY_LABEL: "ready-for-qa"
  QA_PASSED_LABEL: "qa-passed"
  QA_FAILED_LABEL: "qa-failed"
  STALE_DAYS: "14"
  PLATFORM_COMPLIANCE_NOTES: "<!-- No platform-specific compliance rules defined. Edit .codecannon.yaml to add them. -->"
  CONVENTIONS_NOTES: "<!-- No project conventions defined. Edit .codecannon.yaml to add them. -->"
  SENSITIVE_AREAS_GATE: "true"
  SENSITIVE_AREAS_CATEGORIES: |
    - Authentication or authorization logic
    - Payments, billing, or financial transactions
    - Secrets handling (API keys, tokens, credentials, encryption keys)
    - Production configuration (deploy targets, prod env vars, prod-only feature flags)
    - Destructive operations (e.g. `DROP TABLE`, `rm -rf`, `git push --force`, mass deletes, schema drops)
